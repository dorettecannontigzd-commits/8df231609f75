version: 2.1

jobs:
  ssao_kernel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Generate kernel
          command: |
            printf 'samples 32\n' > ssao.cfg
      - run:
          name: Build ambient occlusion
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssao_kernel -j2
      - run:
          name: Sample SSAO kernel
          command: LIONSS_LP=1 ./build/ssao_kernel --conf ssao.cfg --radius 0.5
  kafkaSink3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define sink topic
          command: |
            printf 'topic = events\npartitions = 3\n' > sink.properties
      - run:
          name: Build connector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kafkaSink3 -j2
      - run:
          name: Flush to sink
          command: LIONSS_LP=1 ./build/kafkaSink3 --config sink.properties --batch 500
  cassandra_repair:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List tokens
          command: |
            printf 'range 0-100\n' > tokens.txt
      - run:
          name: Build repair tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cassandra_repair -j2
      - run:
          name: Repair token ranges
          command: LIONSS_LP=1 ./build/cassandra_repair --ranges tokens.txt --full
  stm32h7_blink:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place linker script
          command: |
            mkdir -p ld && printf 'MEMORY { FLASH : ORIGIN = 0x8000000 }\n' > ld/stm32h7.ld
      - run:
          name: Cross-compile firmware
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stm32h7_blink -j2
      - run:
          name: Flash blink image
          command: LIONSS_LP=1 ./build/stm32h7_blink --mcu stm32h743 --freq 480
  loraMerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List adapters
          command: |
            printf 'adapter_a\nadapter_b\n' > adapters.txt
      - run:
          name: Build merge tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target loraMerge -j2
      - run:
          name: Merge LoRA adapters
          command: LIONSS_LP=1 ./build/loraMerge --list adapters.txt --alpha 0.5
  renderGraph:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define passes
          command: |
            printf 'passes 10\n' > rg.cfg
      - run:
          name: Build frame graph
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target renderGraph -j2
      - run:
          name: Compile render graph
          command: LIONSS_LP=1 ./build/renderGraph --conf rg.cfg --alias-memory
